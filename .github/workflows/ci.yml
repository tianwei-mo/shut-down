name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install cfn-lint ruff
      - name: Check Python style
        run: ruff check src tests && ruff format --check src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile src/devbox_power.py
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh src/devbox-power
      - name: Check CLI help
        run: src/devbox_power.py --help >/dev/null && ./install.sh --help >/dev/null
      - name: Validate CloudFormation
        run: cfn-lint infra/cloudformation/devbox-power.yaml
